stages:
  - test
  - package
  - deploy

# ── 质量门禁（integration push 触发） ──

backend-test:
  stage: test
  image: hub.alfadb.cn/docker.io/golang:1.27.3-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "integration"
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key:
      files:
        - backend/go.sum
      prefix: go-mod
    paths:
      - .go/pkg/mod/
  script:
    - cd backend
    - go test -tags unit -count=1 ./...
    - go vet ./...

backend-lint:
  stage: test
  image: hub.alfadb.cn/docker.io/golangci/golangci-lint:v2.14.0-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "integration"
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.golangci-lint-cache
  cache:
    key:
      files:
        - backend/go.sum
      prefix: go-mod
    paths:
      - .go/pkg/mod/
      - .golangci-lint-cache/
  script:
    - cd backend
    - golangci-lint run --timeout=30m ./...

frontend-build:
  stage: test
  image: hub.alfadb.cn/docker.io/node:24-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "integration"
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
      prefix: pnpm
    paths:
      - frontend/node_modules/
  before_script:
    - corepack enable && corepack prepare pnpm@9 --activate
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm build

# ── 打包 & 部署（tag 触发） ──

package:
  stage: package
  image: hub.alfadb.cn/devel/buildkit:rootless
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      # Backend version is embedded from backend/cmd/server/VERSION at build time.
      # Keep it in sync with the Git tag to avoid stale UI version display.
      echo "${CI_COMMIT_TAG#v}" > backend/cmd/server/VERSION

      # Inject 'go mod tidy' into Dockerfile before build step to handle
      # upstream go.mod that may be out of sync with actual imports.
      sed -i '/^COPY backend\/ \.\//a RUN go mod tidy' Dockerfile

      # Use BuildKit's built-in Dockerfile frontend: since the 2026-10-05 rebuild of
      # devel/buildkit:rootless, launching the external docker/dockerfile:1.7
      # frontend container exits 1 on the rootless runner.
      sed -i '1{/^# syntax=/d}' Dockerfile

      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt build-arg:COMMIT=${CI_COMMIT_SHA} \
        --opt build-arg:GOLANG_IMAGE=golang:1.27.3-alpine \
        --export-cache type=registry,ref=hub.alfadb.cn/cache/sub2api:build,mode=max \
        --import-cache type=registry,ref=hub.alfadb.cn/cache/sub2api:build \
        --output type=image,name=hub.alfadb.cn/devel/sub2api:${CI_COMMIT_TAG},push=true

deploy:
  stage: deploy
  image: hub.alfadb.cn/builder/bitnami/kubectl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # 存储已换 RWX（pv-dev-sub2api-data hostPath 静态 PV），滚动更新可正常挂载，
    # 因此恢复 RollingUpdate：新 Pod 就绪后才停旧 Pod，发版不再有切换中断。
    # 用 JSON patch 整体替换 /spec/strategy：strategic merge patch 是 map 合并，
    # 只写 type 会残留另一个方向的子字段（例如 Recreate 时残留 rollingUpdate），
    # 被 API 校验拒绝，整个 patch 失败；JSON patch 两个方向切换都干净、幂等。
    - kubectl -n dev patch deployment sub2api --type=json -p '[{"op":"replace","path":"/spec/strategy","value":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":1,"maxUnavailable":0}}}]'
    # 模板 patch 一次合入镜像 + 宽限期 + preStop：preStop sleep 5 覆盖 endpoints
    # 传播窗口（避免新 Pod 就绪前旧 Pod 已摘流），宽限期 60 覆盖优雅停机耗时。
    - kubectl -n dev patch deployment sub2api --type=strategic -p "{\"spec\":{\"template\":{\"spec\":{\"terminationGracePeriodSeconds\":60,\"containers\":[{\"name\":\"sub2api\",\"image\":\"hub.alfadb.cn/devel/sub2api:${CI_COMMIT_TAG}\",\"lifecycle\":{\"preStop\":{\"exec\":{\"command\":[\"sh\",\"-c\",\"sleep 5\"]}}}}]}}}}"
    - kubectl -n dev rollout status deployment/sub2api --timeout=300s

# ── 通用回滚（manual） ──
# 存储障碍（ZFS-LocalPV 单挂载）已清除，原先「切 Recreate + 强推镜像」的恢复作业
# 已过时——现在强推 Recreate 反而错误。本作业退化为通用回滚工具：undo 到上一修订并
# 等 rollout 收敛，需要人工兜底时手动点。
# allow_failure: true —— 手动兜底作业不得让 integration pipeline 终态卡在
# manual（发版门禁要求精确 SHA 全部 success）。
deploy-recover:
  stage: deploy
  image: hub.alfadb.cn/builder/bitnami/kubectl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "integration"
      when: manual
  allow_failure: true
  script:
    - kubectl -n dev rollout undo deployment/sub2api
    - kubectl -n dev rollout status deployment/sub2api --timeout=300s
