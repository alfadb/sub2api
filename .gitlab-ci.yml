stages:
  - test
  - package
  - deploy

# ── 质量门禁（integration push 触发） ──

backend-test:
  stage: test
  image: hub.alfadb.cn/docker.io/golang:1.27.3-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "integration"
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key:
      files:
        - backend/go.sum
      prefix: go-mod
    paths:
      - .go/pkg/mod/
  script:
    - cd backend
    - go test -tags unit -count=1 ./...
    - go vet ./...

backend-lint:
  stage: test
  image: hub.alfadb.cn/docker.io/golangci/golangci-lint:v2.14.0-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "integration"
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOLANGCI_LINT_CACHE: $CI_PROJECT_DIR/.golangci-lint-cache
  cache:
    key:
      files:
        - backend/go.sum
      prefix: go-mod
    paths:
      - .go/pkg/mod/
      - .golangci-lint-cache/
  script:
    - cd backend
    - golangci-lint run --timeout=30m ./...

frontend-build:
  stage: test
  image: hub.alfadb.cn/docker.io/node:24-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "integration"
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
      prefix: pnpm
    paths:
      - frontend/node_modules/
  before_script:
    - corepack enable && corepack prepare pnpm@9 --activate
  script:
    - cd frontend
    - pnpm install --frozen-lockfile
    - pnpm build

# ── 打包 & 部署（tag 触发） ──

package:
  stage: package
  image: hub.alfadb.cn/devel/buildkit:rootless
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      # Backend version is embedded from backend/cmd/server/VERSION at build time.
      # Keep it in sync with the Git tag to avoid stale UI version display.
      echo "${CI_COMMIT_TAG#v}" > backend/cmd/server/VERSION

      # Inject 'go mod tidy' into Dockerfile before build step to handle
      # upstream go.mod that may be out of sync with actual imports.
      sed -i '/^COPY backend\/ \.\//a RUN go mod tidy' Dockerfile

      # Use BuildKit's built-in Dockerfile frontend: since the 2026-10-05 rebuild of
      # devel/buildkit:rootless, launching the external docker/dockerfile:1.7
      # frontend container exits 1 on the rootless runner.
      sed -i '1{/^# syntax=/d}' Dockerfile

      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt filename=Dockerfile \
        --opt build-arg:COMMIT=${CI_COMMIT_SHA} \
        --opt build-arg:GOLANG_IMAGE=golang:1.27.3-alpine \
        --export-cache type=registry,ref=hub.alfadb.cn/cache/sub2api:build,mode=max \
        --import-cache type=registry,ref=hub.alfadb.cn/cache/sub2api:build \
        --output type=image,name=hub.alfadb.cn/devel/sub2api:${CI_COMMIT_TAG},push=true

deploy:
  stage: deploy
  image: hub.alfadb.cn/builder/bitnami/kubectl:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - kubectl -n dev patch deployment sub2api --type=strategic -p '{"spec":{"strategy":{"type":"Recreate"}}}'
    - kubectl -n dev patch deployment sub2api --type=strategic -p "{\"spec\":{\"template\":{\"spec\":{\"terminationGracePeriodSeconds\":60,\"containers\":[{\"name\":\"sub2api\",\"image\":\"hub.alfadb.cn/devel/sub2api:${CI_COMMIT_TAG}\",\"lifecycle\":null}]}}}}"
    - kubectl -n dev rollout status deployment/sub2api --timeout=300s

# ── 一次性恢复（manual） ──
# 背景：v0.9.367 tag 流水线用 RollingUpdate 部署时，被 ZFS-LocalPV 单挂载
# （同一 RWO 卷第二个 Pod 报 verifyMount: device already mounted）卡住：
# 新 Pod 长期 ContainerCreating，旧 Pod 仍在服务，deployment 超 progress deadline。
# 恢复步骤：rollout undo 把模板退回上一修订 → 控制器删除卡住的 Pod、保留旧 Pod，
# rollout 收敛；然后切回 Recreate + 模板 patch 完成 v0.9.367 上线。
deploy-recover:
  stage: deploy
  image: hub.alfadb.cn/builder/bitnami/kubectl:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "integration"
      when: manual
  variables:
    RECOVER_IMAGE: "hub.alfadb.cn/devel/sub2api:v0.9.367"
  script:
    - kubectl -n dev rollout undo deployment/sub2api || true
    - kubectl -n dev rollout status deployment/sub2api --timeout=120s || true
    - kubectl -n dev patch deployment sub2api --type=strategic -p '{"spec":{"strategy":{"type":"Recreate"}}}'
    - kubectl -n dev patch deployment sub2api --type=strategic -p "{\"spec\":{\"template\":{\"spec\":{\"terminationGracePeriodSeconds\":60,\"containers\":[{\"name\":\"sub2api\",\"image\":\"$RECOVER_IMAGE\",\"lifecycle\":null}]}}}}"
    - kubectl -n dev rollout status deployment/sub2api --timeout=300s
